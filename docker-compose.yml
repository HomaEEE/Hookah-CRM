services:
  web:
    image: ${APP_IMAGE:-noire-web:${APP_VERSION:-latest}}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      SERVER_MODE: ${SERVER_MODE:-frankenphp}
      OCTANE_WORKERS: ${OCTANE_WORKERS:-auto}
      OCTANE_MAX_REQUESTS: ${OCTANE_MAX_REQUESTS:-500}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-noire}
      DB_USERNAME: ${DB_USERNAME:-noire_user}
      DB_PASSWORD: ${DB_PASSWORD:-noire_secret_pass}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CACHE_STORE: ${CACHE_STORE:-redis}
      CACHE_PREFIX: ${CACHE_PREFIX:-noire_cache_}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
      REVERB_HOST: ${REVERB_HOST:-reverb}
      REVERB_PORT: ${REVERB_PORT:-8080}
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - app_storage:/app/storage
    networks:
      - app_network

volumes:
  app_storage:
    driver: local

networks:
  app_network:
    name: ${SHARED_NETWORK:-openship_shared}
    external: true

services:
  web:
    image: ${APP_IMAGE:-noire-web:${APP_VERSION:-latest}}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      # Application Core
      APP_NAME: ${APP_NAME:-HOOKAH CRM}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      SITE_NAME: ${SITE_NAME:-CRM}

      # Server & Runtime Modes
      SERVER_MODE: ${SERVER_MODE:-frankenphp}
      OCTANE_SERVER: ${OCTANE_SERVER:-frankenphp}
      OCTANE_WORKERS: ${OCTANE_WORKERS:-auto}
      OCTANE_MAX_REQUESTS: ${OCTANE_MAX_REQUESTS:-500}

      # Logging
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-null}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Database
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-noire}
      DB_USERNAME: ${DB_USERNAME:-noire_user}
      DB_PASSWORD: ${DB_PASSWORD:-noire_secret_pass}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}

      # Cache, Queue, Session & Storage
      CACHE_STORE: ${CACHE_STORE:-redis}
      CACHE_DRIVER: ${CACHE_DRIVER:-redis}
      CACHE_PREFIX: ${CACHE_PREFIX:-noire_cache_}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-14400}
      MEMCACHED_HOST: ${MEMCACHED_HOST:-}

      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PORT: ${REDIS_PORT:-6379}

      # Broadcasting & WebSockets
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
      BROADCAST_DRIVER: ${BROADCAST_DRIVER:-pusher}
      REVERB_HOST: ${REVERB_HOST:-reverb}
      REVERB_PORT: ${REVERB_PORT:-8080}
      REVERB_SCHEME: ${REVERB_SCHEME:-http}

      # Mail
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-ssl}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-${APP_NAME:-HOOKAH CRM}}

      # AWS S3
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}

      # Pusher
      PUSHER_APP_ID: ${PUSHER_APP_ID:-}
      PUSHER_APP_KEY: ${PUSHER_APP_KEY:-}
      PUSHER_APP_SECRET: ${PUSHER_APP_SECRET:-}
      PUSHER_HOST: ${PUSHER_HOST:-}
      PUSHER_PORT: ${PUSHER_PORT:-443}
      PUSHER_SCHEME: ${PUSHER_SCHEME:-https}
      PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER:-eu}

      # Frontend / Vite
      VITE_APP_NAME: ${VITE_APP_NAME:-${APP_NAME:-HOOKAH CRM}}
      VITE_PUSHER_APP_KEY: ${VITE_PUSHER_APP_KEY:-${PUSHER_APP_KEY:-}}
      VITE_PUSHER_HOST: ${VITE_PUSHER_HOST:-${PUSHER_HOST:-}}
      VITE_PUSHER_PORT: ${VITE_PUSHER_PORT:-${PUSHER_PORT:-443}}
      VITE_PUSHER_SCHEME: ${VITE_PUSHER_SCHEME:-${PUSHER_SCHEME:-https}}
      VITE_PUSHER_APP_CLUSTER: ${VITE_PUSHER_APP_CLUSTER:-${PUSHER_APP_CLUSTER:-eu}}

      # AI Services
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}

      # Firebase
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
      FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID:-}
      FIREBASE_VAPID: ${FIREBASE_VAPID:-}
      FCM_ALERT_SOUND: ${FCM_ALERT_SOUND:-}

      # WebPush / VAPID
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - app_storage:/app/storage
    networks:
      - app_network

volumes:
  app_storage:
    driver: local

networks:
  app_network:
    name: ${SHARED_NETWORK:-openship_shared}
    external: true

services:
  web:
    image: ${APP_IMAGE:-noire-web}:${APP_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    env_file:
      - path: .env
        required: false
    environment:
      CONTAINER_ROLE: web
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - app_storage:/app/storage
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - app_network

  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    restart: unless-stopped
    command: [
      "mariadbd",
      "--innodb-buffer-pool-size=64M",
      "--innodb-log-buffer-size=8M",
      "--max-connections=30",
      "--key-buffer-size=16M"
    ]
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-noire_root_pass}
      MYSQL_DATABASE: ${DB_DATABASE:-noire}
      MYSQL_USER: ${DB_USERNAME:-noire_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-noire_secret_pass}
    deploy:
      resources:
        limits:
          memory: 192M
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-p${DB_ROOT_PASSWORD:-noire_root_pass}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - app_network

volumes:
  app_storage:
    driver: local
  mariadb_data:
    driver: local

networks:
  app_network:
    name: ${SHARED_NETWORK:-openship_shared}
    external: true

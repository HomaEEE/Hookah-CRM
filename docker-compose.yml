services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      CONTAINER_ROLE: app
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-noire}
      DB_USERNAME: ${DB_USERNAME:-noire_user}
      DB_PASSWORD: ${DB_PASSWORD:-noire_secret_pass}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-noire_root_pass}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - app_storage:/app/storage
    depends_on:
      - mariadb
      - redis
    networks:
      - app_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600", "--memory=64"]
    environment:
      CONTAINER_ROLE: worker
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-noire}
      DB_USERNAME: ${DB_USERNAME:-noire_user}
      DB_PASSWORD: ${DB_PASSWORD:-noire_secret_pass}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - app_storage:/app/storage
    depends_on:
      - web
      - mariadb
      - redis
    networks:
      - app_network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      CONTAINER_ROLE: scheduler
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-noire}
      DB_USERNAME: ${DB_USERNAME:-noire_user}
      DB_PASSWORD: ${DB_PASSWORD:-noire_secret_pass}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
    deploy:
      resources:
        limits:
          memory: 64M
    volumes:
      - app_storage:/app/storage
    depends_on:
      - web
      - mariadb
      - redis
    networks:
      - app_network

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    command: [
      "mariadbd",
      "--innodb-buffer-pool-size=64M",
      "--innodb-log-buffer-size=8M",
      "--max-connections=30",
      "--key-buffer-size=16M",
      "--query-cache-size=0",
      "--table-open-cache=200"
    ]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-noire_root_pass}
      MYSQL_DATABASE: ${DB_DATABASE:-noire}
      MYSQL_USER: ${DB_USERNAME:-noire_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-noire_secret_pass}
    deploy:
      resources:
        limits:
          memory: 192M
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    deploy:
      resources:
        limits:
          memory: 48M
    volumes:
      - redis_data:/data
    networks:
      - app_network

volumes:
  app_storage:
    driver: local
  mariadb_data:
    driver: local
  redis_data:
    driver: local

networks:
  app_network:
    driver: bridge

services:
  web:
    image: ${IMAGE_NAME:-ghcr.io/homaeee/hookah-crm}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80"
    environment:
      APP_NAME: "${APP_NAME:-Noire}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-https://noire.od.ua}"
      APP_KEY: "${APP_KEY:-}"

      # Database
      DB_CONNECTION: mysql
      DB_HOST: "${DB_HOST:-mariadb}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-noire}"
      DB_USERNAME: "${DB_USERNAME:-noire}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      DB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-}"

      # Redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"

      # Laravel Drivers
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      CACHE_PREFIX: "${APP_SLUG:-noire}_cache_"
      REDIS_PREFIX: "${APP_SLUG:-noire}_database_"
      SESSION_COOKIE: "${APP_SLUG:-noire}_session"

      # FrankenPHP / Caddy
      SERVER_NAME: ":80"
      FRANKENPHP_CONFIG: "worker ./public/frankenphp-worker.php"
    volumes:
      - app_storage:/app/storage
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  app_storage:
    name: ${APP_SLUG:-noire}_storage

networks:
  infra:
    name: ${INFRA_NETWORK:-shared-backend}
    external: true

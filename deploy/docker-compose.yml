services:
  web:
    image: ${APP_IMAGE:-noire-web}:${APP_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      CONTAINER_ROLE: web
      SERVER_MODE: ${SERVER_MODE:-frankenphp}
      DB_HOST: mariadb
      REDIS_HOST: redis
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - app_storage:/app/storage
    networks:
      - openship-mariadb

volumes:
  app_storage:
    driver: local

networks:
  openship-mariadb:
    external: true

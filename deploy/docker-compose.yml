services:
  web:
    image: ${APP_IMAGE:-noire-web}:${APP_VERSION:-1.0.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      CONTAINER_ROLE: web
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-noire}
      DB_USERNAME: ${DB_USERNAME:-noire_user}
      DB_PASSWORD: ${DB_PASSWORD:-noire_secret_pass}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SERVER_MODE: ${SERVER_MODE:-frankenphp}
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - app_storage:/app/storage

volumes:
  app_storage:
    driver: local

networks:
  default:
    name: ${SHARED_NETWORK:-openship-network}
    external: true

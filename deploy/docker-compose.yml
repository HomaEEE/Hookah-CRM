services:
  web:
    image: ${APP_IMAGE:-ghcr.io/homaeee/hookah-crm}:${APP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      CONTAINER_ROLE: web
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-noire}
      DB_USERNAME: ${DB_USERNAME:-noire_user}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    volumes:
      - app_storage:/app/storage
    networks:
      - openship-mariadb

volumes:
  app_storage:
    driver: local

networks:
  openship-mariadb:
    external: true

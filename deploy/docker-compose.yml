services:
  web:
    image: ${APP_IMAGE:-noire-web}:${APP_VERSION:-1.0.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      CONTAINER_ROLE: web
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - app_storage:/app/storage
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app_network

  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    container_name: openship-mariadb
    restart: unless-stopped
    command:
      [
        "mariadbd",
        "--innodb-buffer-pool-size=128M",
        "--innodb-log-buffer-size=16M",
        "--max-connections=50",
        "--key-buffer-size=16M",
      ]
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", 'mariadb-admin ping -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      app_network:
        aliases:
          - mariadb
          - openship-mariadb

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: openship-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "no",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    deploy:
      resources:
        limits:
          memory: 96M
    volumes:
      - redis_data:/data
    networks:
      app_network:
        aliases:
          - redis
          - openship-redis

volumes:
  app_storage:
    driver: local
  mariadb_data:
    driver: local
  redis_data:
    driver: local

networks:
  app_network:
    name: ${SHARED_NETWORK:-openship}

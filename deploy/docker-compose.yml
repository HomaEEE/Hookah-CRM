services:
  web:
    image: ${APP_IMAGE:-noire-web}:${APP_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      CONTAINER_ROLE: web
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-noire}
      DB_USERNAME: ${DB_USERNAME:-noire_user}
      DB_PASSWORD: ${DB_PASSWORD:-noire_secret_pass}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SERVER_MODE: ${SERVER_MODE:-frankenphp}
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - app_storage:/app/storage
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    container_name: openship-mariadb
    restart: unless-stopped
    command:
      [
        "mariadbd",
        "--innodb-buffer-pool-size=128M",
        "--innodb-log-buffer-size=16M",
        "--max-connections=50",
        "--key-buffer-size=16M",
      ]
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-noire_root_pass}
      MYSQL_DATABASE: ${DB_DATABASE:-noire}
      MYSQL_USER: ${DB_USERNAME:-noire_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-noire_secret_pass}
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", 'mariadb-admin ping -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  app_storage:
    driver: local
  mariadb_data:
    driver: local

networks:
  default:
    name: ${SHARED_NETWORK:-openship-network}
    external: true

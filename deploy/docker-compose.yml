services:
  web:
    image: ${APP_IMAGE:-noire-web}:${APP_VERSION:-1.0.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      CONTAINER_ROLE: web
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - app_storage:/app/storage
    networks:
      - app_network

volumes:
  app_storage:
    driver: local

networks:
  app_network:
    name: ${SHARED_NETWORK:-openship_shared}
    external: true

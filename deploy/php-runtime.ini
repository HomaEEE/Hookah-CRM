; ------------------------------------------------------------------------------
; Runtime-Only PHP Configuration: OPcache Preloading
; ------------------------------------------------------------------------------
; Preload is enabled ONLY in the final runtime container image.
; It must never be loaded during build stages (composer install, dump-autoload,
; filament asset compilation) when /app or vendor/autoload.php may not exist.
; ------------------------------------------------------------------------------

[opcache]
opcache.preload = /app/deploy/preload.php
opcache.preload_user = www-data

services:
  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    container_name: openship-mariadb
    restart: unless-stopped
    command:
      [
        "mariadbd",
        "--innodb-buffer-pool-size=128M",
        "--innodb-log-buffer-size=16M",
        "--max-connections=50",
        "--key-buffer-size=16M",
      ]
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-noire_root_pass}
      MYSQL_DATABASE: ${DB_DATABASE:-noire}
      MYSQL_USER: ${DB_USERNAME:-noire_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-noire_secret_pass}
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", 'mariadb-admin ping -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      app_network:
        aliases:
          - mariadb
          - openship-mariadb

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: openship-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "no",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    deploy:
      resources:
        limits:
          memory: 96M
    volumes:
      - redis_data:/data
    networks:
      app_network:
        aliases:
          - redis
          - openship-redis

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local

networks:
  app_network:
    name: ${SHARED_NETWORK:-openship}
    external: true

services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb_shared
    restart: unless-stopped
    command: [
      "mariadbd",
      "--innodb-buffer-pool-size=64M",
      "--innodb-log-buffer-size=8M",
      "--max-connections=30",
      "--key-buffer-size=16M",
      "--query-cache-size=0",
      "--table-open-cache=200"
    ]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-noire_root_pass}
      MYSQL_DATABASE: ${DB_DATABASE:-noire}
      MYSQL_USER: ${DB_USERNAME:-noire_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-noire_secret_pass}
    deploy:
      resources:
        limits:
          memory: 192M
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: redis_shared
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    deploy:
      resources:
        limits:
          memory: 48M
    volumes:
      - redis_data:/data
    networks:
      - app_network

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local

networks:
  app_network:
    name: ${SHARED_NETWORK:-openship_shared}
    external: true

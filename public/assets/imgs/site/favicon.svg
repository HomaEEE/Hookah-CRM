<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" xmlns="http://www.w3.org/2000/svg" baseProfile="tiny" version="1.2" viewBox="0 0 512 512">
  <style>
    body {
	background: #111;
	}
    /* Плавная анимация при изменении размера (опционально, но красиво) */
    #name, #sup, #Logo {
      transition: all 0.3s ease;
    }
    
    #Logo {
      /* Задаем точку трансформации по центру самого логотипа */
      transform-origin: center;
      transform-box: fill-box;
    }

    /* Правило для размеров 128px и меньше */
    @media (max-width: 128px), (max-height: 128px) {
      #name, #sup {
        display: none; /* Скрываем текст */
      }
      #Logo {
        /* Увеличиваем логотип, чтобы он заполнил пустое пространство */
        /* Значения scale и translate можно немного подкорректировать под ваш идеальный визуал */
        transform: scale(1.6) translate(-10%, 15%);
      }
    }
  </style>


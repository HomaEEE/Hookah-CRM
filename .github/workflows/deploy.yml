name: Build and Deploy

on:
  push:
    branches:
      - v4
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      force_rebuild_base:
        description: 'Force rebuild base image'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      build_base: ${{ steps.filter.outputs.base == 'true' || inputs.force_rebuild_base == true }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check base changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            base:
              - 'deploy/Dockerfile.base'
              - 'deploy/php.ini'
              - 'deploy/Caddyfile'

  build-base:
    needs: check-changes
    if: needs.check-changes.outputs.build_base == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository name
        id: image_name
        run: |
          IMAGE_NAME="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile.base
          push: true
          tags: ${{ steps.image_name.outputs.image }}:base
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

  build-and-push:
    needs: [check-changes, build-base]
    if: always() && !cancelled() && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository name
        id: image_name
        run: |
          IMAGE_NAME="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Build and push application image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          build-args: |
            BASE_IMAGE=${{ steps.image_name.outputs.image }}:base
          push: true
          tags: |
            ${{ steps.image_name.outputs.image }}:latest
            ${{ steps.image_name.outputs.image }}:${{ github.sha }}
            ${{ steps.image_name.outputs.image }}:${{ github.ref_name }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Trigger OpenShip Deploy Webhook
        if: env.OPENSHIP_DEPLOY_WEBHOOK != ''
        env:
          OPENSHIP_DEPLOY_WEBHOOK: ${{ secrets.OPENSHIP_DEPLOY_WEBHOOK }}
        run: |
          curl -f -X POST "$OPENSHIP_DEPLOY_WEBHOOK"

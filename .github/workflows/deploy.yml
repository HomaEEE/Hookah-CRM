name: Build and Deploy Assets

on:
  push:
    branches:
      - v4 # Укажите вашу рабочую ветку

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install Composer dependencies
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install NPM dependencies and Build
        run: |
          npm ci
          npm run build

      - name: Trigger Openship Deploy Webhook
        if: env.OPENSHIP_DEPLOY_WEBHOOK != ''
        env:
          OPENSHIP_DEPLOY_WEBHOOK: ${{ secrets.OPENSHIP_DEPLOY_WEBHOOK }}
        run: |
          curl -f -X POST "$OPENSHIP_DEPLOY_WEBHOOK"

name: Build and Deploy Assets

on:
  push:
    branches:
      - v4 # Укажите вашу рабочую ветку

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install Composer dependencies
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install NPM dependencies and Build
        run: |
          npm ci
          npm run build

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Rsync built assets to Server
        # Синхронизируем ТОЛЬКО папку build. Флаг --delete удалит старые файлы с сервера.
        run: |
          rsync -avz --delete public/build/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.SITE_PATH }}/public/build/

      - name: Trigger Server Deployment Script
        # Отправляем POST-запрос на Webhook Vito Deploy ТОЛЬКО после успешной загрузки файлов
        run: |
          curl -X POST ${{ secrets.DEPLOY_WEBHOOK_URL }}
